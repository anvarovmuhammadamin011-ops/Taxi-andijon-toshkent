services:
  - type: web
    name: taxi-collector
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # --- non-secret config ---
      - key: NODE_ENV
        value: production
      - key: ALLOW_BROWSER_LOGIN
        value: "true"
      - key: MAX_POSTS
        value: "65"
      - key: DATA_DIR
        value: "./data"
      # Channels auto-registered on every start (survives restarts; posts re-backfill)
      - key: SEED_CHANNELS
        value: "asasharboz,Baliqchi_Chinobod_Ulugnor_107,Oltinkol_Chinobod_Baliqchi,tashkent560,taxsislar,ulugnor_baliqchi_toshkent_taksi,s_Sobir_2007,Oltinkol_Toshkent,Chinabod_Toshkent_Baliqchi,Baliqchi_Chinabot,sharxon_toshkentt"
      # Add your Vercel/other frontend origin here if you host the UI separately
      - key: FRONTEND_URLS
        value: "https://localhost:5173,https://taxi-collector.onrender.com"
      # --- secrets: set these in the Render dashboard (copy from taxi-v2/backend/.env) ---
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_USERNAME
        sync: false
